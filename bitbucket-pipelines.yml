# Runs the test suite on every pull request and on pushes to main.
# CONTRIBUTING.md's "Remote of record: Bitbucket" section names this file.
#
# No secrets or credentials: the suite is hermetic (tests/conftest.py raises
# if a test spawns a real backend binary or reaches the real network), so this
# pipeline needs nothing beyond what `uv sync` installs.
#
# Required approvals and the merge-queue setting are branch restrictions in
# the Bitbucket repository, not something this file can hold — see
# CONTRIBUTING.md.

image: python:3.13

definitions:
  caches:
    uv: ~/.cache/uv
  steps:
    - step: &test
        name: Test suite
        caches:
          - uv
        script:
          - pip install uv
          - uv sync
          - uv run pytest tests/ -q -n auto

    # A pull request that changes plan_tool/ adds a changelog fragment or says
    # `No-changelog: <reason>` in a commit message (docs/RELEASING.md). The full
    # clone gives the merge-base diff its history.
    - step: &fragment
        name: Changelog fragment
        clone:
          depth: full
        script:
          - git fetch origin "+refs/heads/${BITBUCKET_PR_DESTINATION_BRANCH}:refs/remotes/origin/${BITBUCKET_PR_DESTINATION_BRANCH}"
          - python3 scripts/release.py --check-fragment "origin/${BITBUCKET_PR_DESTINATION_BRANCH}"

pipelines:
  pull-requests:
    '**':
      - parallel:
          - step: *test
          - step: *fragment
  branches:
    main:
      - step: *test
