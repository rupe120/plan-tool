name: Feature request
description: A change that would make plan-tool more useful to you.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and what gets in the way. Describe the situation before the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The behavior you have in mind, if you have one.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today
      description: Workarounds you use, or other tools you tried.
