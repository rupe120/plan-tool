name: Bug report
description: Something plan-tool did that it should not have, or did not do that it should have.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. For a security problem, do not open an issue; follow [SECURITY.md](https://github.com/rupe120/plan-tool/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: plan-tool version
      description: Output of `plan-tool --version`.
      placeholder: plan-tool 1.3.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - uv tool install from GitHub
        - Clone with an editable install
        - Other
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend the failing command used
      options:
        - claude
        - codex
        - cursor
        - Not applicable (no backend call)
        - Other
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and Python
      placeholder: macOS 15, Python 3.13
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: The command you ran, and what it did.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that shows it, ideally in a fresh repository.
  - type: textarea
    id: output
    attributes:
      label: Output or logs
      description: Run logs can contain prompts and file paths. Remove secrets, private paths and client data before pasting.
      render: text
